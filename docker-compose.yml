services:
  hermus:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HERMUS_GATEWAY_HOST: "0.0.0.0"
      HERMUS_GATEWAY_PORT: "8000"
    volumes:
      - hermus-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
volumes:
  hermus-data:
