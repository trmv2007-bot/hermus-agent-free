# GitHub Actions CI workflow for hermus-agent-free.
#
# ACTIVE copy: .github/workflows/ci.yml  (kept in sync with this reference).
# The workflow is committed to .github/workflows/ci.yml, so GitHub reports a
# real check on every push/PR — verify a commit with:
#   gh api repos/trmv2007-bot/hermus-agent-free/commits/<sha>/status
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Minimal runtime subset the test-suite imports. The full requirements.txt
      # pulls heavy optional extras (playwright, faster-whisper, paramiko,
      # modal, ...) that the offline tests never touch.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            httpx \
            pydantic \
            python-dotenv \
            requests \
            Pillow \
            fastapi \
            "uvicorn[standard]" \
            apscheduler \
            tiktoken \
            python-multipart

      - name: Compile all sources (syntax gate)
        run: |
          python -m compileall -q hermus.py core gateway tools backends scheduler subagents skills tests

      - name: Run test suite
        env:
          HERMUS_MODEL: mock/mock
        run: python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      # Error-class checks only (syntax errors, undefined names, bugbear).
      # Style-only findings intentionally do not gate merges.
      - name: Ruff (error-class rules)
        run: ruff check . --select E9,F63,F7,F82,B,PLE --ignore E501
