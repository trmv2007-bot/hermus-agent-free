[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermus-agent-free"
version = "0.1.0"
description = "A free, open-source, self-hosted AI agent for coding, research, automation and multi-agent work."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = [
  "core*",
  "gateway*",
  "hermus_cli*",
  "backends*",
  "subagents*",
  "scheduler*",
  "policies*",
  "resources*",
  "tui*",
  "skills*",
  "pentest*",
  "android_companion*",
]

[tool.ruff]
# Hermus requires Python 3.10+ (see README); declaring it lets ruff apply
# PEP 585 (dict[str, x]) / PEP 604 (x | None) rewrites safely.
target-version = "py310"
line-length = 130
extend-exclude = ["data", "skills"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "W"]
ignore = ["E501", "E402", "E701", "E702", "W293", "B007", "B904", "F821", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["skills/", "android_companion/"]

[[tool.mypy.overrides]]
module = ["core.log", "core.errors"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
