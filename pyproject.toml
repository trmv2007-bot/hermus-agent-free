[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermus-agent-free"
version = "0.2.0"
description = "A free, open-source, self-hosted AI agent for coding, research, automation and multi-agent work."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["ai", "agent", "llm", "ollama", "self-hosted", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Mirrors requirements.txt. Kept in sync by tests/test_packaging.py, which fails
# the build when the two drift - a requirements-only project is not installable.
dependencies = [
  "huggingface_hub>=0.23.0",
  "faster-whisper>=0.9.0",
  "scrapling[fetchers]>=0.3.10,<0.5",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "tiktoken>=0.5.0",
  "ddgs>=9.0.0",
  "playwright>=1.40.0",
  "Pillow>=10.0.0",
  "imageio-ffmpeg>=0.5.1",
  "feedparser>=6.0.0",
  "pypdf>=4.0.0",
  "PyYAML>=6.0.0",
  "fastapi>=0.104.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9.0",
  "uvicorn[standard]>=0.24.0",
  "websockets>=12.0",
  "APScheduler>=3.10.0",
  "prompt_toolkit>=3.0.41",
  "rich>=13.0.0",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
# Voice + heavier optional integrations live in requirements-optional.txt and are
# installed independently, so one unavailable integration cannot fail a core
# install.
optional = [
]

# Real desktop control. Without these, core/computer/* correctly falls back to the
# dry-run backends and the agent cannot actually click, type, or see - it can only
# plan. Installing this extra is what turns computer control from a simulation
# into real input. `hermes doctor` reports which state you are in.
gui = [
  "pyautogui>=0.9.54",      # mouse + keyboard injection (FAILSAFE = corner-panic stop)
  "pynput>=1.7.7",          # lower-level input, more reliable under load than pyautogui alone
  "mss>=9.0.1",            # fast multi-monitor screen capture (sight)
  "pywinauto>=0.6.8",      # real Win32 window control (focus, menus, close)
  "pygetwindow>=0.0.9",    # window enumerate/move/resize
  "uiautomation>=2.0.22",  # UI Automation tree -> act on elements by NAME, not coordinates
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.14.0",
  "mypy>=1.0.0",
]

# One canonical entrypoint. `hermes` is the product surface; bin/hermes and
# hermes.py stay as thin shims for existing scripts and cron entries.
[project.scripts]
hermes = "hermus_cli:run"

[project.urls]
Homepage = "https://github.com/trmv2007-bot/hermus-agent-free"
Repository = "https://github.com/trmv2007-bot/hermus-agent-free"

# Flat layout with nine top-level packages: setuptools auto-discovery refuses
# this, so the list is explicit. Adding a top-level package means adding it
# here too - tests/test_packaging.py enforces that.
[tool.setuptools]
py-modules = ["bootstrap"]
packages = [
  "backends",
  "core",
  "gateway",
  "hermus_cli",
  "pentest",
  "scheduler",
  "subagents",
  "tools",
  "tui",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.html", "*.css", "*.js", "*.json", "*.j2", "*.jinja"]

[tool.ruff]
# Hermus requires Python 3.10+ (see README); declaring it lets ruff apply
# PEP 585 (dict[str, x]) / PEP 604 (x | None) rewrites safely.
target-version = "py310"
line-length = 130
extend-exclude = ["data", "skills"]

[tool.ruff.lint]
# Full hygiene gate: errors, pyflakes, bugbear, import order, pyupgrade,
# naming, whitespace. E501 is excluded — the formatter owns code layout and
# long string literals / URLs / comments are not worth churning over.
select = ["E", "F", "B", "I", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use loop counters for clarity and blind-ish assertions
# in a few places; keep the gate strict for production code only.
"tests/*" = ["B011", "B017"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Lenient baseline: the tree is only partially typed. New foundation modules
# (core/log.py, core/errors.py, ...) are held to the strict override below and
# `make typecheck` gates on those; the rest of the tree ratchets up module by
# module in later phases instead of blocking all progress on legacy code.
exclude = ["skills/", "android_companion/"]

[[tool.mypy.overrides]]
module = ["core.log", "core.errors"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Replaces the old pytest.ini: a bare checkout must be able to `import core`
# without an editable install, and the developer loop must not need PYTHONPATH.
pythonpath = ["."]
# `fast` is the developer loop (<90s). `slow` is the full end-to-end lane that
# runs in CI/nightly. `perf` guards latency budgets.
markers = [
  "fast: fast developer-loop tests (no network, no subprocess fan-out)",
  "slow: end-to-end / multi-process / gateway-binding tests (nightly lane)",
  "perf: latency and throughput budget guards",
]
addopts = "-ra --strict-markers"
