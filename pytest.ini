[pytest]
pythonpath = .
testpaths = tests
# pytest-asyncio is a declared dev dependency (requirements-dev.txt): the async
# budget tests are marked, and the fixture loop scope is pinned so a future
# pytest-asyncio default cannot silently change them.
asyncio_default_fixture_loop_scope = function
markers =
    browser: drives a real gateway with Playwright; skipped when Chromium is absent
