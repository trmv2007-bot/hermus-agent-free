name: Render JARVIS dashboard preview

on:
  push:
    branches: [redesign/jarvis-main]

jobs:
  render-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory gateway > /tmp/hermus-http.log 2>&1 &
          echo $! > /tmp/hermus-http.pid
          sleep 2

      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Render dashboard
        run: |
          npx --yes playwright@1.56.1 screenshot             --viewport-size="1920,1080"             --full-page             --wait-for-timeout=2000             http://127.0.0.1:4173/control.html             jarvis-dashboard.png

      - name: Upload rendered dashboard
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dashboard-preview
          path: jarvis-dashboard.png
          retention-days: 3
