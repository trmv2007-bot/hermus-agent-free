name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI must exercise the portable local sandbox path. Container/bwrap
      # runtimes can see a different filesystem namespace from the hosted
      # runner's Python installation and are not required for unit tests.
      HERMUS_SANDBOX_MODE: local
      HERMUS_SANDBOX_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run tests
        run: pytest -q
