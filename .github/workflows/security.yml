name: HERMUS Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q core gateway tools tests
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Secret pattern scan
        run: |
          ! grep -RInE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'][^"'"']{12,}["'"']' core gateway tools tests --exclude='*.pyc' || true
