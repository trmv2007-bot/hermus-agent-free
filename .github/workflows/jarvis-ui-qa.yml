name: JARVIS UI QA

on:
  push:
    branches: [redesign/jarvis-main]

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Write temporary UI QA server
        run: |
          cat > /tmp/hermus-ui-server.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = process.cwd();
          const mime = {
            '.html':'text/html; charset=utf-8',
            '.js':'text/javascript; charset=utf-8',
            '.css':'text/css; charset=utf-8',
            '.svg':'image/svg+xml',
            '.json':'application/json'
          };

          const server = http.createServer((req,res)=>{
            const url = new URL(req.url, 'http://127.0.0.1');
            let file = url.pathname === '/control'
              ? path.join(root,'gateway','control.html')
              : url.pathname.startsWith('/static/')
                ? path.join(root,'gateway',url.pathname.slice('/static/'.length))
                : null;
            if(!file){ res.writeHead(404); res.end('not found'); return; }
            if(!fs.existsSync(file) || fs.statSync(file).isDirectory()){ res.writeHead(404); res.end('not found'); return; }
            const ext=path.extname(file);
            res.writeHead(200,{'content-type':mime[ext]||'application/octet-stream'});
            fs.createReadStream(file).pipe(res);
          });

          server.listen(4173,'127.0.0.1');
          EOF

      - name: Write temporary Playwright QA
        run: |
          cat > /tmp/jarvis-ui-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';

          const screenshots='/tmp/jarvis-ui';
          fs.mkdirSync(screenshots,{recursive:true});
          const server=spawn(process.execPath,['/tmp/hermus-ui-server.mjs'],{stdio:'inherit'});
          await new Promise(r=>setTimeout(r,800));

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});

          const json=(body)=>({status:200,contentType:'application/json',body:JSON.stringify(body)});
          await page.route('**/*',async route=>{
            const u=new URL(route.request().url());
            if(!u.pathname.startsWith('/api/') && !u.pathname.startsWith('/models/') && !u.pathname.startsWith('/workshop/') &&
               !u.pathname.startsWith('/context') && !u.pathname.startsWith('/presence/') &&
               !u.pathname.startsWith('/focus') && !u.pathname.startsWith('/learning') &&
               !u.pathname.startsWith('/routines') && !u.pathname.startsWith('/devices') &&
               !u.pathname.startsWith('/personal-space')) return route.continue();

            const method=route.request().method();
            if(u.pathname==='/api/v1/system/health') return route.fulfill(json({gateway:{ok:true},runtime:{running:true},database:{ok:true}}));
            if(u.pathname==='/api/v1/system/capabilities') return route.fulfill(json({capabilities:{web_search:true,osint_tools:true,world_model:true,workshop:true,media:true}}));
            if(u.pathname==='/api/v1/agents/list') return route.fulfill(json({agents:[
              {name:'Researcher',role:'research',state:'working'},
              {name:'Coder',role:'coding',state:'idle'},
              {name:'Designer',role:'design',state:'working'}
            ]}));
            if(u.pathname==='/presence/kernel') return route.fulfill(json({
              summary:{state:'idle',headline:'All systems ready',active_runs:0,attention_count:1},
              attention:[{title:'Mock QA context',detail:'Visual interaction test state',severity:'low'}],
              events:{recent:[{event_id:'qa-1',summary:'UI QA connected',type:'info'}]},
              world:{facts:{}}
            }));
            if(u.pathname==='/models/catalog') return route.fulfill(json({
              count:3,models:[
                {ref:'local/qwen3:4b',provider:'local',provider_name:'Ollama',id:'qwen3:4b',source:'live',reachable:true,capabilities:{tools:'yes',vision:'no'}},
                {ref:'local/vision-demo',provider:'local',provider_name:'Ollama',id:'vision-demo',source:'live',reachable:true,capabilities:{tools:'yes',vision:'yes'}},
                {ref:'nous/solar-demo',provider:'nous',provider_name:'Nous',id:'solar-demo',source:'cached',reachable:true,capabilities:{tools:'yes',vision:'no'}}
              ]
            }));
            if(u.pathname==='/models/selected') return route.fulfill(json({selections:{default:'auto',reasoning:'auto',vision:'local/vision-demo',coding:'local/qwen3:4b',background:'auto',doctor:'auto',voice:'auto'}}));
            if(u.pathname==='/models/health') return route.fulfill(json({models:{'local/qwen3:4b':{avg_latency_ms:42},'local/vision-demo':{avg_latency_ms:65}}}));
            if(u.pathname==='/models/select' && method==='POST') return route.fulfill(json({selections:{default:'auto',reasoning:'auto',vision:'local/vision-demo',coding:'local/qwen3:4b',background:'auto',doctor:'auto',voice:'auto'}}));
            if(u.pathname==='/focus') return route.fulfill(json({items:[{title:'Ship dashboard UI QA',priority:'high'},{title:'Review active missions',priority:'normal'}]}));
            if(u.pathname==='/learning') return route.fulfill(json({lessons:[{title:'UI validation',score:0.96},{title:'Workspace routing',score:0.91}]}));
            if(u.pathname==='/routines') return route.fulfill(json({routines:[{id:'qa-routine',name:'Daily review',enabled:true,event_type:'schedule',action_type:'command',task:'Review workspace'}]}));
            if(u.pathname==='/devices') return route.fulfill(json({browser:{connected:true},desktop:{ready:true},remote:{enabled:false}}));
            if(u.pathname==='/api/v1/console/manifest') return route.fulfill(json({name:'HERMUS Console',status:'ready',version:'qa'}));
            if(u.pathname==='/personal-space' || u.pathname==='/personal-space/') return route.fulfill(json({status:'proposal_ready',idle_for_seconds:420,pending_proposals:1,daily_cycles:1,daily_cap:3,proposals:[{id:'qa-proposal',status:'pending',title:'Polish workspace interactions',summary:'Review every visible control before handoff.',category:'ui',confidence:0.98,why:'QA fixture',next_action:'Approve the review'}]}));
            if(u.pathname==='/personal-space/run' && method==='POST') return route.fulfill(json({status:'curious'}));
            if(u.pathname.startsWith('/personal-space/proposals/') && method==='POST') return route.fulfill(json({success:true}));
            if(u.pathname==='/workshop/snapshot') return route.fulfill(json({
              current:'demo-app',
              projects:[{name:'demo-app'},{name:'hermus-core'}],
              tree:[{name:'src',path:'src',type:'directory'},{name:'app.py',path:'app.py',type:'file',size:321},{name:'README.md',path:'README.md',type:'file',size:120}]
            }));
            if(u.pathname==='/context') return route.fulfill(json({project:'demo-app',summary:{state:'idle'},presence:{world:{facts:{}}},attention:[],memory:[{content:'Dashboard interaction QA'}],goals:[{title:'Ship a polished workspace'}]}));
            if(u.pathname==='/workshop/file' && method==='GET') return route.fulfill(json({path:'app.py',content:'print("HERMUS QA")\n',size:18,editable:true}));
            if(u.pathname==='/workshop/file' && method==='PUT') return route.fulfill(json({success:true}));
            if(u.pathname==='/workshop/project/use' && method==='POST') return route.fulfill(json({success:true}));
            if(u.pathname==='/api/v1/commands' && method==='POST') return route.fulfill(json({accepted:true}));
            if(u.pathname==='/conversation/session' && method==='POST') return route.fulfill(json({session_id:'qa-session'}));
            if(u.pathname==='/jobs' && method==='POST') return route.fulfill(json({accepted:true}));
            if(u.pathname==='/voice/command' && method==='POST') return route.fulfill(json({success:true,text:'QA voice command'}));
            return route.fulfill(json({ok:true,success:true}));
          });

          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',msg=>{ if(msg.type()==='error') errors.push('CONSOLE '+msg.text()); });

          await page.goto('http://127.0.0.1:4173/control',{waitUntil:'networkidle'});
          await page.screenshot({path:screenshots+'/00-baseline.png',fullPage:true});

          const interactables=page.locator('button:visible, a:visible, [role="button"]:visible, select:visible, input:visible, textarea:visible');
          const count=await interactables.count();
          if(count < 30) throw new Error('Expected a rich interactive dashboard, found only '+count+' visible controls');

          for(let i=0;i<count;i++){
            const el=interactables.nth(i);
            const box=await el.boundingBox();
            if(!box || box.width<1 || box.height<1) throw new Error('Invisible/zero-size control at initial index '+i);
          }

          // Every initial visible button must have a real interaction contract.
          const buttons=page.locator('button:visible');
          const buttonCount=await buttons.count();
          for(let i=0;i<buttonCount;i++){
            const b=buttons.nth(i);
            const label=((await b.innerText().catch(()=>'')) || await b.getAttribute('aria-label') || await b.getAttribute('title') || '').trim();
            if(!label) throw new Error('Visible button has no accessible label at index '+i);
            const contract=await b.evaluate(el=>[
              'data-open','data-command','data-workshop-open','data-toggle','data-workbench-tab','data-panel-toggle',
              'data-close-workbench','data-close','id'
            ].some(a=>el.hasAttribute(a)));
            if(!contract) throw new Error('Visible button lacks an interaction contract: '+label);
          }

          // Command palette: open, search, close.
          await page.locator('#globalSearch').click();
          await page.locator('#palette').waitFor({state:'visible'});
          await page.locator('#paletteInput').fill('model');
          await page.locator('#paletteList button').first().click();
          await page.locator('#overlay').waitFor({state:'visible'});
          await page.locator('#overlay [data-close]').click();
          await page.locator('#globalSearch').click();
          await page.locator('#palette').waitFor({state:'visible'});
          await page.locator('#paletteClose').click();

          // Workbench slides/views.
          for(const view of ['chat','ide','browser','terminal','image','video','notes']){
            await page.locator('[data-workbench-tab="'+view+'"]').click();
            if(await page.locator('[data-workbench-tab="'+view+'"]').getAttribute('aria-selected')!=='true') throw new Error('Workbench tab failed: '+view);
            if(await page.locator('[data-workbench-view="'+view+'"]').evaluate(el=>el.classList.contains('active'))!==true) throw new Error('Workbench view failed: '+view);
            await page.screenshot({path:screenshots+'/workbench-'+view+'.png',fullPage:true});
          }

          // Every JARVIS toggle flips both directions.
          for(const toggle of await page.locator('[data-toggle]:visible').all()){
            const before=await toggle.getAttribute('aria-pressed');
            await toggle.click();
            const flipped=await toggle.getAttribute('aria-pressed');
            if(flipped===before) throw new Error('Toggle did not change: '+await toggle.innerText());
            await toggle.click();
            if(await toggle.getAttribute('aria-pressed')!==before) throw new Error('Toggle did not restore: '+await toggle.innerText());
          }

          // Environment HIDE/SHOW.
          const env=page.locator('.environment-panel');
          const hide=env.locator('[data-panel-toggle]');
          await hide.click();
          if(!(await env.evaluate(el=>el.classList.contains('is-collapsed')))) throw new Error('Environment did not collapse');
          await hide.click();
          if(await env.evaluate(el=>el.classList.contains('is-collapsed'))) throw new Error('Environment did not restore');

          // Model role selection + save + sync.
          await page.locator('#modelRole').selectOption('vision');
          await page.locator('#modelSelect').selectOption('local/vision-demo');
          await page.locator('#modelSave').click();
          await page.locator('#modelRefresh').click();

          // Room states.
          for(const room of ['main-hall','ide-lab','model-lab','media-studio','control-room','personal-space']){
            await page.locator('[data-room="'+room+'"]').click();
            if(!(await page.locator('[data-room="'+room+'"]').evaluate(el=>el.classList.contains('active')))) throw new Error('Room selection failed: '+room);
            if(room==='model-lab' || room==='control-room' || room==='personal-space') {
              await page.locator('#overlay').waitFor({state:'visible'});
              await page.locator('#overlay [data-close]').click();
            } else if(room==='main-hall' || room==='ide-lab') {
              await page.locator('#workshop').waitFor({state:'visible'});
              await page.locator('#workshopClose').click();
            }
          }

          // Personal Space opening + proposal actions.
          await page.locator('#personalSpaceOpenDock').click();
          await page.locator('#overlay').waitFor({state:'visible'});
          if(!(await page.locator('#personalSpaceActions').count())) throw new Error('Personal Space actions not rendered');
          await page.locator('#overlay [data-close]').click();

          // Workshop: projects, file, edit, save, ask, mission, send, close.
          await page.locator('[data-workshop-open]').first().click();
          await page.locator('#workshop').waitFor({state:'visible'});
          await page.locator('#workshopRefresh').click();
          await page.locator('[data-workshop-project="demo-app"]').click();
          await page.locator('[data-workshop-path="app.py"]').click();
          await page.locator('#workshopEditor').fill('print("edited by QA")\n');
          await page.locator('#workshopSave').click();
          await page.locator('#workshopAsk').click();
          if(!(await page.locator('#command').isFocused())) throw new Error('Workshop ASK did not focus command');
          await page.locator('#workshopMissionOpen').click();
          await page.locator('#overlay').waitFor({state:'visible'});
          await page.locator('#overlay [data-close]').click();
          await page.locator('#workshopCommand').fill('Review this workspace');
          await page.locator('#workshopSend').click();
          await page.locator('#workshop').waitFor({state:'hidden'});
          
          // Workbench close / restore.
          await page.locator('[data-workbench-tab="chat"]').click();
          await page.locator('#workbenchClose').click();
          if(!(await page.locator('.bottom-workbench').evaluate(el=>el.classList.contains('is-hidden')))) throw new Error('Workbench did not hide');
          await page.locator('#workbenchRestore').click();
          if(await page.locator('.bottom-workbench').evaluate(el=>el.classList.contains('is-hidden'))) throw new Error('Workbench did not restore');

          // Chat input: send button + Enter.
          await page.locator('#command').fill('QA command');
          await page.locator('#send').click();
          await page.locator('#command').fill('QA enter command');
          await page.locator('#command').press('Enter');

          // Voice must respond gracefully in headless browser.
          await page.locator('#voiceButton').click();

          // Every visible nav/sidebar/system button should execute without throwing.
          const stableButtons=await page.locator('button:visible').all();
          for(const b of stableButtons){
            const txt=((await b.innerText().catch(()=>''))||await b.getAttribute('aria-label')||'').trim();
            if(!txt) continue;
            const disabled=await b.isDisabled().catch(()=>true);
            if(disabled) continue;
            const workshop=await b.getAttribute('data-workshop-open');
            const open=await b.getAttribute('data-open');
            const command=await b.getAttribute('data-command');
            const toggle=await b.getAttribute('data-toggle');
            const tab=await b.getAttribute('data-workbench-tab');
            const panel=await b.getAttribute('data-panel-toggle');
            const id=await b.getAttribute('id');
            if(toggle||tab||panel||id==='workbenchClose'||id==='workbenchRestore') continue;
            await b.click().catch(()=>{});
            await page.waitForTimeout(80);
            if(await page.locator('#overlay').evaluate(el=>el.classList.contains('open'))){
              await page.locator('#overlay [data-close]').click().catch(()=>{});
            }
            if(await page.locator('#workshop').evaluate(el=>el.classList.contains('open'))){
              await page.locator('#workshopClose').click().catch(()=>{});
            }
          }

          await page.screenshot({path:screenshots+'/99-final.png',fullPage:true});
          await browser.close();
          server.kill();

          if(errors.length) throw new Error(errors.join('\n'));
          EOF

      - name: Run browser QA
        run: node /tmp/jarvis-ui-qa.mjs

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ui-qa
          path: /tmp/jarvis-ui/*.png
          if-no-files-found: error
