name: Visual check - JARVIS dashboard

on:
  push:
    branches: [redesign/jarvis-main]

jobs:
  render-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory gateway > /tmp/hermus-http.log 2>&1 &
          echo $! > /tmp/hermus-http.pid
          sleep 2
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Render dashboard
        run: |
          npx --yes playwright@1.56.1 screenshot \
            --viewport-size="1920,1080" \
            --full-page \
            --wait-for-timeout=3000 \
            http://127.0.0.1:4173/control.html \
            jarvis-dashboard-current.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dashboard-current
          path: jarvis-dashboard-current.png
          retention-days: 2
