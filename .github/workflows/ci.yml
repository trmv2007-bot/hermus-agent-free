name: HERMUS CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMUS_SANDBOX_MODE: local
      HERMUS_SANDBOX_NETWORK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q --ignore=tests/eval
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy core/log.py core/errors.py
