name: HERMUS CI
permissions:
  contents: write

on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep CI state disposable and independent from a developer machine.
      HERMUS_HOME: /tmp/hermus-ci-home
      HERMUS_SANDBOX: local
      HERMUS_SANDBOX_NETWORK: "false"
      HERMUS_ASK_POLICY: allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q core gateway tools hermus_cli scheduler
      - run: python -m pytest tests/ -q --ignore=tests/eval

      # Normalize the historical Ruff backlog once on the dedicated repair
      # branch. The actual fixes are committed so main will validate the exact
      # same tree after merge.
      - name: Normalize Ruff debt (repair branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/all-green'
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: normalize Ruff violations"
            git push origin HEAD:fix/all-green
          fi

      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy core/log.py core/errors.py

      - name: JavaScript syntax
        run: node --check gateway/static/nexus.js


  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA against mocked services
        run: |
          mkdir -p /tmp/hermus-ui/static
          cp gateway/control.html /tmp/hermus-ui/control.html
          cp -r gateway/static/. /tmp/hermus-ui/static/
          python -m http.server 4173 --directory /tmp/hermus-ui >/tmp/hermus-ui-server.log 2>&1 &
          cat >/tmp/jarvis-ui-qa.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';

          const out='/tmp/jarvis-ui';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1920,height:1080}});
          page.setDefaultTimeout(1800);
          page.setDefaultNavigationTimeout(5000);

          const json=(body)=>({status:200,contentType:'application/json',body:JSON.stringify(body)});
          await page.route('**/*',async route=>{
            const u=new URL(route.request().url()), m=route.request().method(), p=u.pathname;
            if(m==='POST') return route.fulfill(json({success:true,accepted:true,ok:true,session_id:'qa'}));
            if(!/^(\/api\/|\/models\/|\/workshop\/|\/context|\/presence\/|\/focus|\/learning|\/routines|\/devices|\/personal-space)/.test(p)) return route.continue();
            if(p==='/api/v1/system/health') return route.fulfill(json({gateway:{ok:true},runtime:{running:true}}));
            if(p==='/api/v1/system/capabilities') return route.fulfill(json({capabilities:{web_search:true,osint_tools:true,world_model:true,workshop:true,media:true}}));
            if(p==='/api/v1/agents/list') return route.fulfill(json({agents:[{name:'Researcher',role:'research',state:'working'},{name:'Coder',role:'coding',state:'idle'}]}));
            if(p==='/presence/kernel') return route.fulfill(json({summary:{state:'idle',headline:'All systems ready',active_runs:0,attention_count:0},attention:[],events:{recent:[]},world:{facts:{}}}));
            if(p==='/models/catalog') return route.fulfill(json({count:2,models:[{ref:'local/qwen3:4b',provider:'local',provider_name:'Ollama',id:'qwen3:4b',source:'live',reachable:true,capabilities:{tools:'yes',vision:'no'}},{ref:'local/vision-demo',provider:'local',provider_name:'Ollama',id:'vision-demo',source:'live',reachable:true,capabilities:{tools:'yes',vision:'yes'}}]}));
            if(p==='/models/selected') return route.fulfill(json({selections:{default:'auto',reasoning:'auto',vision:'local/vision-demo',coding:'local/qwen3:4b',background:'auto',doctor:'auto',voice:'auto'}}));
            if(p==='/models/health') return route.fulfill(json({models:{'local/qwen3:4b':{avg_latency_ms:42},'local/vision-demo':{avg_latency_ms:61}}}));
            if(p==='/models/select' || p==='/conversation/session' || p==='/api/v1/commands' || p==='/jobs') return route.fulfill(json({success:true,accepted:true,session_id:'qa',selections:{default:'auto',vision:'local/vision-demo',coding:'local/qwen3:4b'}}));
            if(p==='/focus') return route.fulfill(json({items:[{title:'UI QA',priority:'high'}]}));
            if(p==='/learning') return route.fulfill(json({lessons:[{title:'UI validation'}]}));
            if(p==='/routines') return route.fulfill(json({routines:[{name:'Daily review',enabled:true,event_type:'schedule',action_type:'command',task:'Review workspace'}]}));
            if(p==='/devices') return route.fulfill(json({browser:{connected:true},desktop:{ready:true}}));
            if(p==='/api/v1/console/manifest') return route.fulfill(json({name:'HERMUS Console',status:'ready'}));
            if(p==='/personal-space' || p==='/personal-space/') return route.fulfill(json({status:'proposal_ready',idle_for_seconds:120,pending_proposals:1,daily_cycles:1,daily_cap:3,proposals:[{id:'qa',status:'pending',title:'QA proposal',summary:'Review every visible control.',category:'ui',confidence:.99,why:'QA',next_action:'Approve'}]}));
            if(p==='/personal-space/run' || p.startsWith('/personal-space/proposals/')) return route.fulfill(json({success:true,status:'curious'}));
            if(p==='/workshop/snapshot') return route.fulfill(json({current:'demo-app',projects:[{name:'demo-app'},{name:'hermus-core'}],tree:[{name:'app.py',path:'app.py',type:'file',size:18},{name:'README.md',path:'README.md',type:'file',size:10}]}));
            if(p==='/context') return route.fulfill(json({project:'demo-app',summary:{state:'idle'},presence:{world:{facts:{}}},attention:[],memory:[{content:'QA'}],goals:[{title:'Ship'}]}));
            if(p==='/workshop/file' && m==='GET') return route.fulfill(json({path:'app.py',content:'print(1)\\n',size:9,editable:true}));
            if(p==='/workshop/file' && m==='PUT') return route.fulfill(json({success:true}));
            if(p==='/workshop/project/use' && m==='POST') return route.fulfill(json({success:true}));
            return route.fulfill(json({success:true,ok:true}));
          });

          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',msg=>{if(msg.type()==='error') errors.push(msg.text())});

          await page.goto('http://127.0.0.1:4173/control.html',{waitUntil:'domcontentloaded'});
          console.log('QA: baseline');
          await page.screenshot({path:out+'/00-baseline.png',fullPage:false});

          const visibleButtons=page.locator('button:visible');
          const count=await visibleButtons.count();
          if(count<30) throw new Error('Too few visible buttons: '+count);

          for(let i=0;i<count;i++){
            const b=visibleButtons.nth(i);
            const label=((await b.innerText().catch(()=>''))||await b.getAttribute('aria-label')||await b.getAttribute('title')||'').trim();
            if(!label) throw new Error('Unlabelled visible button '+i);
            const contract=await b.evaluate(el=>['data-open','data-command','data-workshop-open','data-toggle','data-workbench-tab','data-panel-toggle','data-close-workbench','data-close','id'].some(a=>el.hasAttribute(a)));
            if(!contract) throw new Error('Unbound visible button: '+label);
            const box=await b.boundingBox();
            if(!box||box.width<1||box.height<1) throw new Error('Bad geometry: '+label);
          }

          console.log('QA: palette');
          await page.locator('#globalSearch').click();
          await page.locator('#paletteInput').fill('model');
          if(await page.locator('#paletteList button').count()!==1) throw new Error('Palette filter failed');
          await page.locator('#paletteList button').first().click();
          await page.locator('#overlay [data-close]').click();

          console.log('QA: workbench slides');
          for(const v of ['chat','ide','browser','terminal','image','video','notes']){
            await page.locator('[data-workbench-tab="'+v+'"]').click();
            if(!(await page.locator('[data-workbench-view="'+v+'"]').evaluate(el=>el.classList.contains('active')))) throw new Error('Workbench view failed: '+v);
            await page.waitForTimeout(350);
            await page.screenshot({path:out+'/workbench-'+v+'.png',fullPage:false});
          }

          console.log('QA: toggles');
          for(const t of await page.locator('[data-toggle]:visible').all()){
            const before=await t.getAttribute('aria-pressed');
            await t.click();
            if(await t.getAttribute('aria-pressed')===before) throw new Error('Toggle failed');
            await t.click();
            if(await t.getAttribute('aria-pressed')!==before) throw new Error('Toggle restore failed');
          }

          console.log('QA: environment');
          const env=page.locator('.environment-panel');
          await env.locator('[data-panel-toggle]').click();
          if(!(await env.evaluate(el=>el.classList.contains('is-collapsed')))) throw new Error('Environment collapse failed');
          await env.locator('[data-panel-toggle]').click();

          console.log('QA: models');
          await page.locator('#modelRole').selectOption('vision');
          await page.locator('#modelSelect').selectOption('local/vision-demo');
          await page.locator('#modelSave').click();
          await page.locator('#modelRefresh').click();

          console.log('QA: rooms');
          await page.locator('[data-room="main-hall"]').click(); await page.locator('#workshopClose').click();
          await page.locator('[data-room="ide-lab"]').click(); await page.locator('#workshopClose').click();
          await page.locator('[data-room="model-lab"]').click(); await page.locator('#overlay [data-close]').click();
          await page.locator('[data-room="media-studio"]').click();
          await page.locator('[data-room="control-room"]').click(); await page.locator('#overlay [data-close]').click();
          await page.locator('[data-room="personal-space"]').click(); await page.locator('#overlay [data-close]').click();

          console.log('QA: personal space');
          await page.locator('#personalSpaceOpenDock').click();
          await page.locator('#overlay').waitFor({state:'visible'});
          if(!(await page.locator('#personalSpaceActions').count())) throw new Error('Personal Space actions missing');
          await page.locator('#overlay [data-close]').click();

          console.log('QA: workshop');
          await page.locator('[data-workshop-open]').first().click();
          await page.locator('#workshop').waitFor({state:'visible'});
          await page.locator('#workshopRefresh').click();
          await page.locator('[data-workshop-project="demo-app"]').click();
          await page.locator('[data-workshop-path="app.py"]').click();
          await page.locator('#workshopEditor').fill('print(2)');
          await page.locator('#workshopSave').click();
          await page.locator('#workshopAsk').click(); await page.waitForTimeout(50);
          if(!(await page.locator('#workshopCommand').evaluate(el=>document.activeElement===el))) throw new Error('ASK did not focus Workshop command');
          await page.locator('#workshopCommand').fill('Review workspace');
          await page.locator('#workshopSend').click();
          await page.locator('#workshop').waitFor({state:'hidden'});

          console.log('QA: workbench hide/restore and chat');
          await page.locator('[data-workbench-tab="chat"]').click();
          await page.locator('#workbenchClose').click();
          if(!(await page.locator('.bottom-workbench').evaluate(el=>el.classList.contains('is-hidden')))) throw new Error('Workbench hide failed');
          await page.locator('#workbenchRestore').click();
          await page.locator('#command').fill('QA command');
          await page.locator('#send').click();
          await page.locator('#command').fill('QA enter');
          await page.locator('#command').press('Enter');
          await page.locator('#voiceButton').click();

          console.log('QA: unique action coverage');
          const opens=[...new Set(await page.locator('[data-open]:visible').evaluateAll(es=>es.map(e=>e.getAttribute('data-open'))))];
          for(const name of opens){
            await page.locator('[data-open="'+name+'"]:visible').first().click();
            await page.waitForTimeout(50);
            if(await page.locator('#overlay').evaluate(el=>el.classList.contains('open'))) await page.locator('#overlay [data-close]').click();
          }
          const commands=[...new Set(await page.locator('[data-command]:visible').evaluateAll(es=>es.map(e=>e.getAttribute('data-command'))))];
          for(const command of commands){
            await page.locator('[data-command="'+command+'"]:visible').first().click();
            await page.waitForTimeout(50);
          }

          await page.locator('[data-workbench-tab="chat"]').click();
          await page.locator('[data-room="main-hall"]').click();
          await page.waitForTimeout(350);
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.screenshot({path:out+'/99-final.png',fullPage:false});
          await browser.close();
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          EOF
          cp /tmp/jarvis-ui-qa.mjs ./jarvis-ui-qa.mjs
          node ./jarvis-ui-qa.mjs
      - name: Upload JARVIS visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ui-qa
          path: /tmp/jarvis-ui/*.png
          if-no-files-found: error
