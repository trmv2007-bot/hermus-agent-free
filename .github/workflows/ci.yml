name: HERMUS CI
permissions:
  contents: write

on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep CI state disposable and independent from a developer machine.
      HERMUS_HOME: /tmp/hermus-ci-home
      HERMUS_SANDBOX: local
      HERMUS_SANDBOX_NETWORK: "false"
      HERMUS_ASK_POLICY: allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q core gateway tools hermus_cli scheduler
      - run: python -m pytest tests/ -q --ignore=tests/eval

      # Normalize the historical Ruff backlog once on the dedicated repair
      # branch. The actual fixes are committed so main will validate the exact
      # same tree after merge.
      - name: Normalize Ruff debt (repair branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/all-green'
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: normalize Ruff violations"
            git push origin HEAD:fix/all-green
          fi

      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy core/log.py core/errors.py

      - name: JavaScript syntax
        run: |
          node --check gateway/static/nexus.js
          node --check gateway/static/dashboard-v2.js


  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA for HERMUS dashboard
        run: |
          mkdir -p /tmp/hermus-ui/static
          cp gateway/control.html /tmp/hermus-ui/control.html
          cp -r gateway/static/. /tmp/hermus-ui/static/
          python -m http.server 4173 --directory /tmp/hermus-ui >/tmp/hermus-ui-server.log 2>&1 &
          cat >/tmp/dashboard-v2-qa.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const out='/tmp/hermus-ui';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1920,height:1080}});
          page.setDefaultTimeout(2500);
          const json=(x)=>({status:200,contentType:'application/json',body:JSON.stringify(x)});
          await page.route('**/*',async route=>{
            const u=new URL(route.request().url()),p=u.pathname,m=route.request().method();
            if(m==='POST') return route.fulfill(json({success:true,accepted:true,ok:true,session_id:'qa'}));
            if(p==='/api/v1/system/health') return route.fulfill(json({gateway:{ok:true},runtime:{running:true}}));
            if(p==='/api/v1/system/capabilities') return route.fulfill(json({providers:[{name:'Local Runtime',ok:true}],tools:{web_search:{description:'Web search',available:true},terminal:{description:'Terminal execution',available:true},image_generation:{description:'Image generation',available:true}}}));
            if(p==='/api/v1/agents/list'||p==='/agents') return route.fulfill(json({agents:[{name:'Researcher',role:'research',state:'working'},{name:'Coder',role:'coding',state:'idle'}]}));
            if(p==='/presence/kernel') return route.fulfill(json({summary:{active_runs:1,attention_count:1},attention:[{title:'UI review',detail:'One QA task',severity:'medium'}],events:{recent:[{summary:'Test run ready',type:'run_finished',at:'now'}]}}));
            if(p==='/models/catalog') return route.fulfill(json({count:2,models:[{ref:'local/qwen3:4b',id:'qwen3:4b',name:'Qwen 3 4B',provider:'Ollama',source:'live',reachable:true,capabilities:{tools:'yes',vision:'no'}},{ref:'local/vision',id:'vision',name:'Vision Demo',provider:'Ollama',source:'live',reachable:true,capabilities:{tools:'yes',vision:'yes'}}]}));
            if(p==='/models/selected') return route.fulfill(json({selections:{default:'auto',vision:'local/vision',coding:'local/qwen3:4b'}}));
            if(p==='/routines') return route.fulfill(json({routines:[{id:'r1',name:'Daily review',enabled:true,event_type:'schedule',action_type:'runtime.turn'}]}));
            if(p==='/missions') return route.fulfill(json({missions:[{id:'m1',goal:'Review workspace',state:'blocked'}]}));
            if(p==='/learning') return route.fulfill(json({lessons:[{title:'UI validation',summary:'Reusable lesson'}]}));
            if(p==='/personal-space') return route.fulfill(json({status:'proposal_ready',idle_for_seconds:120,daily_cycles:1,daily_cap:3,proposals:[{id:'p1',status:'pending',title:'Useful discovery',summary:'QA proposal'}]}));
            if(p==='/workshop/snapshot') return route.fulfill(json({current:'demo-app',projects:[{name:'demo-app'},{name:'hermus-core'}],tree:[{name:'app.py',path:'app.py',type:'file',size:12}]}));
            if(p==='/context') return route.fulfill(json({project:'demo-app',summary:{state:'idle'},attention:[],goals:[{title:'Ship dashboard'}],memory:[{content:'QA note'}]}));
            if(p==='/workshop/file'&&m==='GET') return route.fulfill(json({path:'app.py',content:'print(1)\\n',size:9,editable:true}));
            return route.fulfill(json({success:true,ok:true}));
          });
          const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/control.html',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(300);
          await page.screenshot({path:out+'/00-overview.png'});
          const nav=[...new Set(await page.locator('[data-view]:visible').evaluateAll(es=>es.map(e=>e.dataset.view)))];
          for(const v of nav){
            await page.locator('[data-view="'+v+'"]:visible').first().click();
            await page.waitForTimeout(100);
            if(!(await page.locator('#view-'+v).evaluate(el=>el.classList.contains('active'))))throw new Error('View failed to open: '+v);
            await page.screenshot({path:out+'/view-'+v+'.png'});
          }
          await page.locator('[data-view="overview"]').first().click();
          await page.locator('[data-overview-send]').click().catch(()=>{});
          await page.locator('[data-command]').first().click();
          await page.locator('#commandFocus').click();
          if(!(await page.locator('#commandPalette').evaluate(el=>el.classList.contains('open'))))throw new Error('Command palette click failed');
          await page.locator('#paletteClose').click();
          await page.locator('#topCommand').press('Enter');
          if(!(await page.locator('#commandPalette').evaluate(el=>el.classList.contains('open'))))throw new Error('Command palette keyboard failed');
          await page.keyboard.press('Escape');
          await page.locator('[data-view="models"]').first().click();
          await page.locator('#modelRoleInput').selectOption('vision');
          await page.locator('#modelDeploymentInput').selectOption('local/vision');
          await page.locator('[data-model-save]').click();
          await page.locator('[data-view="agents"]').first().click();
          if(await page.locator('[data-agent-action]').count()<2)throw new Error('Agent controls missing');
          await page.locator('[data-view="missions"]').first().click();
          await page.locator('[data-routine-new]').click();
          await page.locator('#routineName').fill('QA routine');
          await page.locator('#routineEvent').fill('schedule');
          await page.locator('#routineTask').fill('Review workspace');
          await page.locator('[data-routine-validate]').click();
          await page.locator('[data-view="personal"]').first().click();
          if(!(await page.locator('[data-personal-run]').count()))throw new Error('Personal Space controls missing');
          await page.locator('[data-view="build"]').first().click();
          await page.waitForTimeout(250);
          if(!(await page.locator('[data-project="demo-app"]').count()))throw new Error('Workshop project UI missing');
          await page.locator('[data-project="demo-app"]').click();
          await page.waitForTimeout(150);
          await page.locator('[data-file="app.py"]').click();
          await page.locator('#buildEditor').fill('print(2)');
          await page.locator('#buildSave').click();
          await page.locator('[data-view="browser"]').first().click();
          await page.locator('#browserUrl').fill('https://example.com');
          await page.locator('[data-browser-open]').click();
          await page.locator('[data-view="terminal"]').first().click();
          await page.locator('#terminalInput').fill('echo QA');
          await page.locator('[data-tool-run="terminal"]').click();
          await page.locator('[data-view="image"]').first().click();
          await page.locator('#imageInput').fill('QA concept');
          await page.locator('[data-tool-run="image"]').click();
          await page.locator('[data-view="video"]').first().click();
          await page.locator('#videoInput').fill('QA shot');
          await page.locator('[data-tool-run="video"]').click();
          await page.evaluate(()=>{if(document.documentElement.scrollWidth>innerWidth+2)throw new Error('Desktop horizontal overflow')});
          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          const mobileErrors=[];mobile.on('pageerror',e=>mobileErrors.push(e.message));mobile.on('console',m=>{if(m.type()==='error')mobileErrors.push(m.text())});
          await mobile.goto('http://127.0.0.1:4173/control.html',{waitUntil:'domcontentloaded'});await mobile.waitForTimeout(250);
          const mobileViews=await mobile.locator('[data-view]:visible').count();if(mobileViews<10)throw new Error('Mobile navigation incomplete');
          if(await mobile.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw new Error('Mobile horizontal overflow');
          await mobile.locator('[data-view="agents"]:visible').first().click();
          if(!(await mobile.locator('#view-agents').evaluate(el=>el.classList.contains('active'))))throw new Error('Mobile view switching failed');
          await mobile.screenshot({path:out+'/mobile-agents.png'});
          if(mobileErrors.length)throw new Error('Mobile browser errors: '+mobileErrors.join(' | '));
          await mobile.close();
          await browser.close();
          if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
          console.log('HERMUS DASHBOARD QA PASS');
          EOF
          node /tmp/dashboard-v2-qa.mjs
      - name: Upload dashboard QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermus-dashboard-v2-qa
          path: /tmp/hermus-ui/*.png
          if-no-files-found: error
