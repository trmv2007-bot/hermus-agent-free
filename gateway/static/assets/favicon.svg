<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a7ebff"/>
      <stop offset="100%" style="stop-color:#3f9cff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%" fx="32%" fy="30%">
      <stop offset="0%" style="stop-color:#bdf1ff"/>
      <stop offset="55%" style="stop-color:#5fd8ff"/>
      <stop offset="100%" style="stop-color:#0a1626"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="#040912" stroke="rgba(95,216,255,0.35)" stroke-width="1"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(95,216,255,0.28)" stroke-width="1" stroke-dasharray="3 9">
    <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="16 10">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="19" fill="url(#orb)" opacity="0.95"/>
</svg>
