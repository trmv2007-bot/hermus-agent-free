<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#41e8ff"/>
      <stop offset="100%" style="stop-color:#ff7ad9"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#7c3a5e"/>
      <stop offset="100%" style="stop-color:#04070c"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#orb)" stroke="#41e8ff" stroke-width="2"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 9">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="20" fill="url(#grad)" text-anchor="middle" font-weight="bold">H</text>
</svg>
