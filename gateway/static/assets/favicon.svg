<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:#234f72"/>
      <stop offset="100%" style="stop-color:#0e1420"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#orb)" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="20" fill="#58a6ff" text-anchor="middle" font-weight="bold">H</text>
</svg>
