<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a7ebff"/>
      <stop offset="100%" style="stop-color:#5fd8ff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5fd8ff"/>
      <stop offset="100%" style="stop-color:#3f9cff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%" fx="32%" fy="30%">
      <stop offset="0%" style="stop-color:#bdf1ff"/>
      <stop offset="55%" style="stop-color:#5fd8ff"/>
      <stop offset="100%" style="stop-color:#0a1626"/>
    </radialGradient>
  </defs>

  <!-- Holo core mark -->
  <circle cx="40" cy="30" r="25" fill="#040912" stroke="rgba(95,216,255,0.4)" stroke-width="1"/>
  <circle cx="40" cy="30" r="20" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 8">
    <animateTransform attributeName="transform" type="rotate" from="0 40 30" to="360 40 30" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="30" r="13" fill="url(#orb)"/>

  <!-- Main Text -->
  <text x="72" y="26" font-family="Arial, sans-serif" font-size="19" fill="#5fd8ff" font-weight="bold" letter-spacing="3">HERMUS</text>

  <!-- Subtext -->
  <text x="72" y="42" font-family="Arial, sans-serif" font-size="9" fill="#7e94b0" font-weight="normal" letter-spacing="4">HOLO AGENT</text>
</svg>
